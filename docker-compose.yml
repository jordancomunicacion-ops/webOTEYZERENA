# Convención de la suite (_infra-comun/STACKS.md): un stack por cosa desplegable
# y el nombre del stack = el nombre corto de esa cosa —`obrador`, `crm`, `bot`...
# y `web-<marca>` para las webs. Aquí el stack pasa de "sotooteyzerena"
# (herencia de la época sotodelprior) a "web-oteyzerena", que además es como ya
# se llama el repo.
# Las webs quedan agrupadas como web-* en la lista de contenedores, cada una con
# su propio ciclo de vida (un `docker compose down` no toca a las demás).
#
# OJO al desplegar por primera vez tras el rename: el contenedor viejo
# `sotooteyzerena-web` pertenece al stack antiguo, así que compose NO lo retira
# y quedarían dos contenedores sirviendo el mismo Host en Traefik. Hay que
# borrarlo a mano una vez:  docker rm -f sotooteyzerena-web
name: "web-oteyzerena"

networks:
  proxy-net:
    external: true

services:
  web-oteyzerena:
    build: .
    container_name: web-oteyzerena
    restart: unless-stopped
    init: true
    networks:
      - proxy-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('os').hostname();fetch('http://'+h+':3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.http.routers.web-oteyzerena.middlewares=web-oteyzerena-wwwredir"
      - "traefik.http.middlewares.web-oteyzerena-wwwredir.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.web-oteyzerena-wwwredir.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.web-oteyzerena-wwwredir.redirectregex.permanent=true"
      # Router HTTPS
      - "traefik.http.routers.web-oteyzerena.rule=Host(`oteyzerena.com`) || Host(`www.oteyzerena.com`)"
      - "traefik.http.routers.web-oteyzerena.entrypoints=websecure"
      - "traefik.http.routers.web-oteyzerena.tls=true"
      - "traefik.http.routers.web-oteyzerena.tls.certresolver=le"
      # Servicio
      - "traefik.http.services.web-oteyzerena.loadbalancer.server.port=3000"
      # Redirect HTTP -> HTTPS
      - "traefik.http.routers.web-oteyzerena-http.rule=Host(`oteyzerena.com`) || Host(`www.oteyzerena.com`)"
      - "traefik.http.routers.web-oteyzerena-http.entrypoints=web"
      - "traefik.http.routers.web-oteyzerena-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
